name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to normalize
        required: true
        default: v0.1.2

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: ""
            args: "--bundles msi,nsis"
          - name: Windows ARM64
            os: windows-latest
            rust_targets: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc --bundles msi,nsis"
          - name: macOS Universal
            os: macos-latest
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: Linux x64
            os: ubuntu-22.04
            rust_targets: ""
            args: "--bundles appimage,deb,rpm"
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            rust_targets: ""
            args: "--bundles appimage,deb,rpm"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version and tag
        run: bun run release:verify-version "${{ github.ref_name }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend for Windows packaging
        if: runner.os == 'Windows'
        run: bun run build

      - name: Build and attach release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Haruha ${{ github.ref_name }}"
          releaseBody: |
            ### 中文

            此草稿由 GitHub Actions 自动创建。发布前请核对更新日志、资产名称、SHA-256 和真实设备验证结果。

            - Windows、macOS 和 Linux 资产默认未签名。
            - 自动构建成功不代表对应平台的系统代理行为已经完成正式验证。

            ### English

            This draft was created automatically by GitHub Actions. Before publishing, verify the changelog, asset names, SHA-256 hashes, and real-device test evidence.

            - Windows, macOS, and Linux assets are unsigned by default.
            - A successful automated build does not mean system-proxy behavior has been formally validated on that platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ matrix.name }}" -eq "Windows ARM64") {
            $source = "src-tauri/target/aarch64-pc-windows-msvc/release/Haruha.exe"
            $assetName = "04-Haruha-" + $tag + "-Windows-ARM64-Portable.exe"
          }
          else {
            $source = "src-tauri/target/release/Haruha.exe"
            $assetName = "01-Haruha-" + $tag + "-Windows-x64-Portable.exe"
          }
          $destination = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath $source -Destination $destination
          gh release upload $tag $destination --repo $env:GITHUB_REPOSITORY --clobber

  windows_portable:
    name: Build portable ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            rust_target: ""
            executable_path: src-tauri/target/release/Haruha.exe
            asset_order: "01"
            asset_arch: x64
          - name: Windows ARM64
            rust_target: aarch64-pc-windows-msvc
            executable_path: src-tauri/target/aarch64-pc-windows-msvc/release/Haruha.exe
            asset_order: "04"
            asset_arch: ARM64

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version and tag
        run: bun run release:verify-version "${{ inputs.tag }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend for portable packaging
        run: bun run build

      - name: Build portable executable
        shell: pwsh
        run: |
          $tauriArgs = @("x", "tauri", "build", "--no-bundle")
          if ("${{ matrix.rust_target }}" -ne "") {
            $tauriArgs += @("--target", "${{ matrix.rust_target }}")
          }
          & bun @tauriArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Portable build failed with exit code $LASTEXITCODE."
          }

      - name: Attach portable executable to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          $assetName = "${{ matrix.asset_order }}-Haruha-" + $tag + "-Windows-${{ matrix.asset_arch }}-Portable.exe"
          $destination = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath "${{ matrix.executable_path }}" -Destination $destination
          gh release upload $tag $destination --repo $env:GITHUB_REPOSITORY --clobber

  normalize-release:
    name: Normalize assets, notes, and publish Latest
    needs: [build, windows_portable]
    if: ${{ always() && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.windows_portable.result == 'success')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5

      - name: Normalize and publish release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          script: |
            const normalizeRelease = require("./scripts/normalize-github-release-assets.cjs");
            await normalizeRelease({ github, context, core });
